<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Milk Tea Shop Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f6f2;
            margin: 0;
            padding: 0;
        }
        header {
            background: #a67873;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .dashboard {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 30px;
            width: 300px;
            text-align: center;
        }
        .card h2 {
            margin: 0 0 10px 0;
            color: #a67873;
        }
        .card p {
            font-size: 2em;
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 15px;
            background: #eee;
            color: #888;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Milk Tea Shop Dashboard</h1>
    </header>
    <div class="dashboard">
        <div class="card">
            <h2>Today's Sales</h2>
            <p>₱3,500</p>
        </div>
        <div class="card">
            <h2>Inventory</h2>
            <p>120 cups</p>
        </div>
        <div class="card">
            <h2>Pending Orders</h2>
            <p>8</p>
        </div>
    </div>
    <footer>
        &copy; 2024 Milk Tea Shop
    </footer>
</body>
</html>
